<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noxin AI</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #171717; color: #fff; font-family: sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }

    #sidebar { width: 260px; background-color: #212121; display: flex; flex-direction: column; padding: 12px; border-right: 1px solid #2f2f2f; }
    .brand { font-size: 18px; font-weight: bold; margin-bottom: 15px; padding: 8px 10px; color: #ececec; display: flex; align-items: center; gap: 10px; }
    .brand img { height: 28px; width: 28px; border-radius: 6px; object-fit: cover; }
    
    .sidebar-btn { display: flex; align-items: center; gap: 10px; background: transparent; border: none; color: #ececec; padding: 10px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; width: 100%; transition: background 0.2s; }
    .sidebar-btn:hover, .sidebar-btn.active { background-color: #2f2f2f; }
    .new-chat-btn { background-color: #2f2f2f; margin-bottom: 10px; }
    
    .section-title { font-size: 12px; color: #8e8e93; font-weight: bold; margin: 12px 10px 6px 10px; text-transform: uppercase; }

    .nav-section { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    #recent-chats-list { display: flex; flex-direction: column; gap: 2px; max-height: 200px; overflow-y: auto; }
    .chat-item { font-size: 13px; padding: 8px 10px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
    
    #main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
    .view-panel { display: none; flex: 1; flex-direction: column; height: 100%; }
    .view-panel.active { display: flex; }

    #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { padding: 12px 16px; border-radius: 12px; max-width: 75%; line-height: 1.5; animation: messageSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .user { background: #2f2f2f; align-self: flex-end; }
    .ai { background: #212121; border: 1px solid #333; align-self: flex-start; }
    .msg pre { background: #0d0d0d; padding: 10px; border-radius: 6px; overflow-x: auto; }
    .msg img.inline-gen-img { width: 100%; max-width: 400px; border-radius: 8px; margin-top: 10px; border: 1px solid #3a3a3a; display: block; }

    #input-area { display: flex; gap: 10px; padding: 15px 20px; background-color: #171717; }
    input { flex: 1; padding: 14px; border-radius: 8px; border: 1px solid #3a3a3a; background: #212121; color: #fff; font-size: 14px; outline: none; }
    button.action-btn { padding: 12px 24px; border-radius: 8px; border: none; background: #6200ee; color: #fff; font-weight: bold; cursor: pointer; transition: transform 0.15s ease, background-color 0.2s ease; }
    button.action-btn:hover { transform: scale(1.03); background-color: #7c24f9; }

    .panel-container { padding: 24px; overflow-y: auto; flex: 1; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 20px; }
    .gallery-card { background: #212121; border: 1px solid #333; border-radius: 8px; overflow: hidden; padding: 8px; }
    .gallery-card img { width: 100%; border-radius: 6px; display: block; }
    .gallery-card p { font-size: 12px; color: #ccc; margin: 8px 0 0 0; }

    @keyframes messageSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="brand">
      <img src="NOXIN AI LOGO.jpg" alt="Noxin AI Logo">
      <span>Noxin AI</span>
    </div>
    <button class="sidebar-btn new-chat-btn" onclick="startNewChat()">➕ New Chat</button>

    <div class="nav-section">
      <button class="sidebar-btn active" id="btn-chat" onclick="switchTab('chat')">💬 Chat</button>
      <button class="sidebar-btn" id="btn-images" onclick="switchTab('images')">🖼️ Generate Images</button>
      <button class="sidebar-btn" id="btn-library" onclick="switchTab('library')">📚 Library</button>

      <div class="section-title">Recent Chats</div>
      <div id="recent-chats-list"></div>
    </div>
  </div>

  <div id="main-content">
    
    <div id="panel-chat" class="view-panel active">
      <div id="chat-box"></div>
      <div id="input-area">
        <input type="text" id="userInput" placeholder="Message Noxin AI..." onkeydown="if(event.key === 'Enter') sendMsg()">
        <button class="action-btn" onclick="sendMsg()">Send</button>
      </div>
    </div>

    <div id="panel-images" class="view-panel">
      <div class="panel-container">
        <h2>🖼️ AI Image Generator</h2>
        <p style="color: #aaa;">Describe any image you want Noxin AI to create for you:</p>
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
          <input type="text" id="imagePrompt" placeholder="A futuristic cyberpunk city with glowing neon lights...">
          <button class="action-btn" onclick="generateImage()">Generate</button>
        </div>
        <div id="imageResult"></div>
      </div>
    </div>

    <div id="panel-library" class="view-panel">
      <div class="panel-container">
        <h2>📚 Your Image Library</h2>
        <p style="color: #aaa;">All saved images created during your sessions:</p>
        <div id="libraryGrid" class="gallery-grid"></div>
      </div>
    </div>

  </div>

  <script>
    let currentChatId = Date.now();
    let chats = JSON.parse(localStorage.getItem('noxin_chats') || '{}');
    let library = JSON.parse(localStorage.getItem('noxin_library') || '[]');

    function switchTab(tab) {
      document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.sidebar-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById('panel-' + tab).classList.add('active');
      document.getElementById('btn-' + tab).classList.add('active');

      if (tab === 'library') renderLibrary();
    }

    function renderRecentChats() {
      const list = document.getElementById('recent-chats-list');
      list.innerHTML = '';
      Object.keys(chats).reverse().forEach(id => {
        const item = document.createElement('button');
        item.className = 'sidebar-btn chat-item';
        item.textContent = chats[id].title || 'Chat ' + id.toString().slice(-4);
        item.onclick = () => loadChat(id);
        list.appendChild(item);
      });
    }

    function startNewChat() {
      currentChatId = Date.now();
      document.getElementById('chat-box').innerHTML = '';
      switchTab('chat');
    }

    function loadChat(id) {
      currentChatId = id;
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';
      (chats[id].messages || []).forEach(msg => {
        const div = document.createElement('div');
        div.className = 'msg ' + msg.role;
        div.innerHTML = msg.role === 'ai' ? parseAiMessage(msg.text) : msg.text;
        chatBox.appendChild(div);
      });
      switchTab('chat');
    }

    function saveMessage(role, text) {
      if (!chats[currentChatId]) {
        chats[currentChatId] = { title: text.slice(0, 20) + '...', messages: [] };
      }
      chats[currentChatId].messages.push({ role, text });
      localStorage.setItem('noxin_chats', JSON.stringify(chats));
      renderRecentChats();
    }

    function parseAiMessage(text) {
      let html = marked.parse(text);
      
      const imgRegex = /\[IMAGE:\s*(.*?)\]/gi;
      html = html.replace(imgRegex, (match, prompt) => {
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true`;
        
        library.push({ prompt, url });
        localStorage.setItem('noxin_library', JSON.stringify(library));

        return `<br><img class="inline-gen-img" src="${url}" alt="${prompt}"><br>`;
      });

      return html;
    }

    async function sendMsg() {
      const input = document.getElementById('userInput');
      const chatBox = document.getElementById('chat-box');
      const message = input.value.trim();

      if (!message) return;

      const userDiv = document.createElement('div');
      userDiv.className = 'msg user';
      userDiv.textContent = message;
      chatBox.appendChild(userDiv);
      saveMessage('user', message);

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      const aiDiv = document.createElement('div');
      aiDiv.className = 'msg ai';
      aiDiv.textContent = 'Thinking...';
      chatBox.appendChild(aiDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: message })
        });

        const data = await res.json();
        const replyText = data.reply || "Sorry, I couldn't generate a response.";

        aiDiv.innerHTML = parseAiMessage(replyText);
        saveMessage('ai', replyText);
        chatBox.scrollTop = chatBox.scrollHeight;

      } catch (err) {
        aiDiv.textContent = 'Sorry, error connecting to server.';
      }
    }

    async function generateImage() {
      const promptInput = document.getElementById('imagePrompt');
      const resultBox = document.getElementById('imageResult');
      const prompt = promptInput.value.trim();

      if (!prompt) return;

      resultBox.innerHTML = '<p>🎨 Generating image with Noxin AI...</p>';
      
      const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true`;

      const img = new Image();
      img.src = imageUrl;
      img.onload = () => {
        resultBox.innerHTML = `
          <div class="gallery-card" style="max-width: 400px;">
            <img src="${imageUrl}" alt="Generated Image">
            <p><strong>Prompt:</strong> ${prompt}</p>
          </div>
        `;
        library.push({ prompt, url: imageUrl });
        localStorage.setItem('noxin_library', JSON.stringify(library));
      };
    }

    function renderLibrary() {
      const grid = document.getElementById('libraryGrid');
      grid.innerHTML = '';
      if (library.length === 0) {
        grid.innerHTML = '<p style="color: #8e8e93;">No saved images yet. Ask Noxin AI to generate some!</p>';
        return;
      }
      library.slice().reverse().forEach(item => {
        const card = document.createElement('div');
        card.className = 'gallery-card';
        card.innerHTML = `
          <img src="${item.url}" alt="Library Image">
          <p>${item.prompt}</p>
        `;
        grid.appendChild(card);
      });
    }

    renderRecentChats();
  </script>
</body>
</html>
